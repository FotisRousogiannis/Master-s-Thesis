# Ο βραχίονας στο Pi (ADR-0021): σήμερα μόνο η βάση (διαφορικό joint_1 + joint_2).
# Γωνίες σε μοίρες εδώ· στο ROS 2 (topics) σε ακτίνια.
#
# Εδώ: ΚΑΛΩΔΙΩΣΗ και ΣΧΕΔΙΑΣΜΟΣ (ομάδες, κανάλια encoders, ποιο servo σε ποια ομάδα, μίξη, έλεγχος, όρια).
# Ό,τι ΜΕΤΡΙΕΤΑΙ έρχεται από το ΚΟΙΝΟ αρχείο βαθμονόμησης
#   software/ros2_ws/src/arm_calibration/config/calibration.yaml   (ADR-0017/0019)
# στην εκκίνηση, και ζωντανά από το Arm Studio (node /arm_calibration του PC):
#   encoders.<άρθρωση>: zero_deg, invert, deadband_pos/neg
#   servos.<servo>:     channel, neutral_us, invert (κατοπτρικό), deadband_down_us/up_us
#   gripper:            open_deg (όρια αρπάγης), contact_v (όριο επαφής)
segment: base               # topics: /base/joint_states, /base/joint_commands (ADR-0007)
i2c_bus: 1
tca_address: 0x70

pca:
  address: 0x40
  mux_channel: 0
  freq_hz: 50
  osc_hz: 25000000
  pulse_min_us: 500         # προδιαγραφή του servo, δεν ξεπερνιέται ποτέ
  pulse_max_us: 2500
  max_offset_us: 900        # όριο ασφαλείας γύρω από το νεκρό σημείο

control:                    # κοινά για ΟΛΕΣ τις αρθρώσεις και ΟΛΟΥΣ τους νόμους (ιδιότητες υλικού)
  max_speed: 0.5            # μέγιστη εντολή (κλάσμα ταχύτητας)
  min_speed: 0.3            # ελάχιστη εντολή όταν δεν υπάρχει μετρημένη νεκρή ζώνη
  tolerance_deg: 1.0        # μέσα σε αυτό η άρθρωση «έφτασε»: έξοδος 0
  limit_margin_deg: 5.0     # πέρα από τα όρια + αυτό: στάση
  deadband_margin: 0.03     # προστίθεται στη μετρημένη νεκρή ζώνη
  motor_compensation: true  # κάθε μοτέρ ξεκινά από την άκρη της δικής του νεκρής ζώνης
  stop: brake               # στάση με παλμό νεκρού σημείου (κρατά τη βαρύτητα)· off = κανένας παλμός.
                            # Στον τερματισμό του node ΠΑΝΤΑ κανένας παλμός (Driver.stop).

# Ομάδες: αρθρώσεις και τα μοτέρ που τις κινούν. Κάθε μοτέρ: mix = πόσο συμμετέχει σε κάθε
# άρθρωση (ταχύτητα μοτέρ = Σ mix × ταχύτητα άρθρωσης· × −1 αν το servo έχει invert).
# Νόμος ελέγχου ανά άρθρωση: law: {type: pid, kp, ki, kd} ή {type: bang_bang, speed} (laws.py).
groups:
  base:                     # διαφορικό
    enabled: true
    joints:
      joint_1:              # yaw (στροφή της βάσης)
        mux_channel: 2      # κανάλι του TCA9548A όπου είναι ο ENCODER της άρθρωσης
        lower_deg: -30.0
        upper_deg: 50.0
        law: {type: pid, kp: 0.02, ki: 0.0, kd: 0.0}    # τιμές πάγκου, ΟΧΙ ρυθμισμένες
      joint_2:              # roll του διαφορικού: σηκώνει τον βραχίονα (pitch στο URDF)
        mux_channel: 1
        lower_deg: -90.0
        upper_deg: 90.0
        law: {type: pid, kp: 0.02, ki: 0.0, kd: 0.0}
    motors:
      a:
        servo: base_a                     # όνομα στο calibration.yaml (κανάλι, νεκρό σημείο, ζώνη)
        mix: {joint_1: 1, joint_2: 1}     # μαζί → joint_1, αντίθετα → joint_2
      b:
        servo: base_b                     # κατοπτρικό (invert: true στο calibration.yaml)
        mix: {joint_1: 1, joint_2: -1}

# ---------------------------------------------------------------------------------------------
# Τα υπόλοιπα κομμάτια: γραμμένα, αλλά ΑΠΕΝΕΡΓΟΠΟΙΗΜΕΝΑ (enabled: false) μέχρι να συνδεθούν. Ο driver
# αγνοεί εντελώς μια ομάδα με enabled: false (ούτε encoders ούτε μοτέρ, ούτε έλεγχος βαθμονόμησης).
# Για να ενεργοποιήσεις μία:
#   1. συμπλήρωσε τα «;» παρακάτω (κανάλι mux του encoder) και έλεγξε τα όρια
#   2. βάλε τα servo της στο calibration.yaml (servos.<όνομα>: channel, neutral_us, invert, note)
#      και το μηδέν/φορά του encoder (encoders.<άρθρωση>), π.χ. από το Arm Studio
#   3. enabled: true, και επανεκκίνηση του container (docker compose up -d --force-recreate)
# Κάθε ομάδα ελέγχεται χωριστά: ενεργοποίησε μία, δοκίμασέ την, μετά την επόμενη.

  joint_3:                  # δύο κατοπτρικά servo, μία κίνηση (Φώτης, 2026-11-17)
    enabled: false
    joints:
      joint_3:
        mux_channel: null   # ; κανάλι του TCA9548A με τον encoder του joint_3
        lower_deg: -90.0    # ±90° (Φώτης)
        upper_deg: 90.0
        law: {type: pid, kp: 0.02, ki: 0.0, kd: 0.0}
    motors:
      a: {servo: joint3_a, mix: {joint_3: 1}}
      b: {servo: joint3_b, mix: {joint_3: 1}}     # το κατοπτρικό: invert: true στο calibration.yaml

  joint_4:                  # πιθανότατα δύο κατοπτρικά όπως το joint_3 (ΠΡΟΣ ΕΠΙΒΕΒΑΙΩΣΗ)
    enabled: false
    joints:
      joint_4:
        mux_channel: null   # ;
        lower_deg: -90.0    # ; όρια προς επιβεβαίωση
        upper_deg: 90.0
        law: {type: pid, kp: 0.02, ki: 0.0, kd: 0.0}
    motors:
      a: {servo: joint4_a, mix: {joint_4: 1}}
      b: {servo: joint4_b, mix: {joint_4: 1}}

  wrist:                    # διαφορικό joint_5 + joint_6, όπως η βάση
    enabled: false
    joints:
      joint_5:
        mux_channel: null   # ;
        lower_deg: -90.0    # ; όρια προς επιβεβαίωση
        upper_deg: 90.0
        law: {type: pid, kp: 0.02, ki: 0.0, kd: 0.0}
      joint_6:
        mux_channel: null   # ;
        lower_deg: -90.0    # ;
        upper_deg: 90.0
        law: {type: pid, kp: 0.02, ki: 0.0, kd: 0.0}
    motors:
      a: {servo: wrist_diff_a, mix: {joint_5: 1, joint_6: 1}}    # ήδη στο calibration.yaml (πάγκος καρπού)
      b: {servo: wrist_diff_b, mix: {joint_5: 1, joint_6: -1}}

  gripper:                  # ένα servo, AS5600 στον άξονα, 2 × ZD10 μέσω ADS1115 (ADR-0020/0021)
    enabled: false
    controller: gripper
    joints:
      gripper:              # όρια: 0° (κλειστή) έως gripper.open_deg του calibration.yaml
        mux_channel: null   # ; ο ADS1115 είναι στο ΙΔΙΟ κανάλι (ADR-0021)
        law: {type: pid, kp: 0.02, ki: 0.0, kd: 0.0}
    motors:
      a: {servo: gripper, mix: {gripper: 1}}
    adc: {mux_channel: null, address: 0x48, full_scale_v: 4.096, rate_sps: 860}   # ; ίδιο κανάλι
    force_sensors:          # όριο επαφής: gripper.contact_v στο calibration.yaml (χωρίς: μόνο θέση)
      finger_1: {input: 0}  # ADS1115 A0
      finger_2: {input: 1}  # ADS1115 A1
