# Παράδειγμα (όταν συνδεθεί): η αρπάγη. Ένα servo, AS5600 στον άξονα, 2 × ZD10 μέσω ADS1115 στο
# ΙΔΙΟ κανάλι του mux με τον AS5600 της (ADR-0021). Όρια κίνησης: 0° (κλειστή) έως gripper.open_deg
# του calibration.yaml (0 = δεν ανοίγει, μέχρι να βαθμονομηθεί). Το κλείσιμο σταματά όταν κάποιο
# δάχτυλο ξεπεράσει το gripper.contact_v του calibration.yaml (V στην είσοδο του ADS1115· χωρίς πίεση
# ~0.94 V, μέγιστη ~2.5 V· χωρίς contact_v: καμία ανίχνευση επαφής).
