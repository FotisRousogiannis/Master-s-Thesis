# Usage (from this directory):
#   docker compose build          # once, or after Dockerfile changes
#   docker compose up -d          # start the container
#   docker compose exec dev bash  # open a shell inside it
#   docker compose down           # stop it
# Linux: run `xhost +local:docker` on the host first so GUIs (RViz, Gazebo) can open.
# Windows: run these commands from the WSL Ubuntu shell (WSLg provides the display).
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: robotic-arm-dev:jazzy
    container_name: robotic-arm-dev
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # Arm Studio layouts/settings live in the repo's .local/ (not in git) so they survive `docker compose down`.
      - ARM_GUI_CONFIG_DIR=/home/ubuntu/master-s-thesis/.local/arm_gui
      # Logbook database and recordings (ADR-0020): on the host disk, outside git.
      - ARM_DATA_DIR=/home/ubuntu/master-s-thesis/.local
      # Calibration is saved straight into the repo file (ADR-0017), whatever the colcon install mode.
      - ARM_CALIBRATION_FILE=/home/ubuntu/master-s-thesis/software/ros2_ws/src/arm_calibration/config/calibration.yaml
    volumes:
      - ../..:/home/ubuntu/master-s-thesis
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
