# Inverse kinematics of the planning group (docs/decisions/0025). KDL: generic, needs no
# analytic solution; good enough while the model is provisional (ADR-0009).
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
