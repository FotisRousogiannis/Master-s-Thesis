# Βαθμονόμηση του βραχίονα (ADR-0017, ADR-0019): servo (κανάλι, νεκρό σημείο, φορά, νεκρή ζώνη), encoders
# (μηδέν, φορά, νεκρή ζώνη άρθρωσης), αρπάγη και όρια ασφαλείας. ΚΟΙΝΟ αρχείο για Arm Studio (PC), arm_pi_driver
# (Pi) και, αργότερα, τα ESP32. Αλλάζει από το Arm Studio (πάνελ «Παράμετροι» → «Αποθήκευση στο αρχείο») ή με το χέρι.
# Τιμές: καρπός από software/tools/wrist_bench/wrist_bench.json· βάση από base_calibration.json (πάγκος, 2026-11-14).
spec:
  pwm_freq_hz: 50
  pulse_min_us: 500
  pulse_max_us: 2500
servos:
  base_a:
    channel: 0
    neutral_us: 1630
    invert: false
    note: διαφορικό βάσης, κινητήρας A· teleop [10] 2026-11-14
    deadband_down_us: 1420
    deadband_up_us: 1840
  base_b:
    channel: 1
    neutral_us: 1605
    invert: true
    note: διαφορικό βάσης, κινητήρας B (κατοπτρικός)· teleop [10] 2026-11-14
    deadband_down_us: 1510
    deadband_up_us: 1700
  wrist_diff_a:
    channel: 9
    neutral_us: 1600
    invert: false
    note: διαφορικό καρπού, κινητήρας A
  wrist_diff_b:
    channel: 10
    neutral_us: 1600
    invert: true
    note: διαφορικό καρπού, κινητήρας B (κατοπτρικός)
  wrist_upper_1:
    channel: 8
    neutral_us: 1600
    invert: false
    note: κανάλι προς επαλήθευση (T3/T4)
  wrist_upper_2:
    channel: 11
    neutral_us: 1600
    invert: false
    note: κανάλι προς επαλήθευση (T3/T4)
encoders:
  gripper:
    zero_deg: 0.0
    invert: false
    note: δεν έχει οριστεί (ADR-0020) — 0° = πλήρως κλειστή
  joint_1:
    zero_deg: 267.891
    invert: false
    note: βάση, yaw· πάγκος 2026-11-14 (teleop [6], base_calibration.json)
    deadband_pos: 0.05
    deadband_neg: 0.05
  joint_2:
    zero_deg: 112.676
    invert: true
    note: βάση, roll του διαφορικού· πάγκος 2026-11-14 (teleop [6], base_calibration.json)
    deadband_pos: 0.07
    deadband_neg: 0.07
  joint_3:
    zero_deg: 0.0
    invert: false
    note: δεν έχει οριστεί (ADR-0019)
  joint_4:
    zero_deg: 0.0
    invert: false
    note: δεν έχει οριστεί (ADR-0019)
  joint_5:
    zero_deg: 0.0
    invert: false
    note: δεν έχει οριστεί (ADR-0019)
  joint_6:
    zero_deg: 0.0
    invert: false
    note: δεν έχει οριστεί (ADR-0019)
gripper:
  open_deg: 0.0
safety:
  max_offset_us: 900
  max_duration_s: 3.0
  max_travel_deg: 30.0
