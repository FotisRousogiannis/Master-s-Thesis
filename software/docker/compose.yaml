# Usage (from this directory):
#   docker compose build          # once, or after Dockerfile changes
#   docker compose up -d          # start the container
#   docker compose exec dev bash  # open a shell inside it
#   docker compose down           # stop it
# Linux: run `xhost +local:docker` on the host first so GUIs (RViz, Gazebo) can open.
# Windows: run these commands from the WSL Ubuntu shell (WSLg provides the display).
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: robotic-arm-dev:jazzy
    container_name: robotic-arm-dev
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ../..:/home/ubuntu/master-s-thesis
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
