# MoveIt executes plans through the same arm_controller as Arm Studio, on every hardware
# (arm_bringup/config/controllers.yaml, docs/decisions/0025).
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

trajectory_execution:
  allowed_execution_duration_scaling: 1.5   # slow servos: be patient before calling a plan failed
  allowed_goal_duration_margin: 1.0
  allowed_start_tolerance: 0.02             # rad: the real arm is never exactly where it was told
