name: PCB checks (KiCad 10)

on:
  push:
    paths: ["hardware/pcb/**", ".github/workflows/pcb.yml"]
  pull_request:
    paths: ["hardware/pcb/**"]
  workflow_dispatch:

jobs:
  segment-board:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    defaults:
      run:
        working-directory: hardware/pcb/segment_board
    steps:
      - uses: actions/checkout@v4
      - name: KiCad version and default libraries
        run: |
          kicad-cli version
          mkdir -p ~/.config/kicad/10.0
          cp /usr/share/kicad/template/sym-lib-table ~/.config/kicad/10.0/
          cp /usr/share/kicad/template/fp-lib-table ~/.config/kicad/10.0/
      - name: ERC
        run: |
          kicad-cli sch erc --format report --severity-all -o erc.rpt segment_board.kicad_sch
          cat erc.rpt
          kicad-cli sch erc --exit-code-violations --severity-error -o erc_errors.rpt segment_board.kicad_sch
      - name: Netlist check
        if: always()
        run: |
          kicad-cli sch export netlist -o board.net segment_board.kicad_sch
          python3 gen/check_netlist.py board.net
      - name: Schematic PDF
        if: always()
        run: kicad-cli sch export pdf -o segment_board_schematic.pdf segment_board.kicad_sch
      - name: DRC (report only until the layout is finished)
        if: always()
        run: |
          kicad-cli pcb drc --schematic-parity --severity-all --format report -o drc.rpt segment_board.kicad_pcb || true
          test -f drc.rpt || { echo "::error::DRC could not load the board"; exit 1; }
          grep -E "^\*\* " drc.rpt || true
          grep -E "^\[[a-z_]+\]" drc.rpt | sed 's/:.*//' | sort | uniq -c | sort -rn || true
          echo "--- errors other than unconnected items / library version differences:"
          grep -A3 -E "^\[(clearance|shorting_items|solder_mask_bridge|footprint_symbol_mismatch|extra_footprint|missing_footprint|net_conflict|duplicate_footprints|hole_clearance|copper_edge_clearance)\]" drc.rpt | head -80 || true
      - name: Board images
        if: always()
        continue-on-error: true
        run: |
          kicad-cli pcb export svg --layers Edge.Cuts,F.Cu,F.SilkS,F.Fab,Dwgs.User --exclude-drawing-sheet -o board_top.svg segment_board.kicad_pcb
          kicad-cli pcb render --side top --width 1600 --height 1600 -o board_3d_top.png segment_board.kicad_pcb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segment-board-checks
          path: |
            hardware/pcb/segment_board/erc.rpt
            hardware/pcb/segment_board/erc_errors.rpt
            hardware/pcb/segment_board/segment_board_schematic.pdf
            hardware/pcb/segment_board/drc.rpt
            hardware/pcb/segment_board/board_top.svg
            hardware/pcb/segment_board/board_3d_top.png
